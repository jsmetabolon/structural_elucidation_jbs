<svg xmlns="http://www.w3.org/2000/svg" width="660" height="312" viewBox="0 0 660 312" font-family="Montserrat, Avenir Next, Segoe UI, Arial, sans-serif">
<rect width="660" height="312" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="659" height="311" fill="none" stroke="#D9D9D9" stroke-width="0.75"/>
<text x="30" y="30" font-size="17" text-anchor="start" fill="#001D38" font-weight="bold">Two paths to a biochemical assignment</text>
<text x="30" y="52" font-size="12" text-anchor="start" fill="#5C6B7A">Which path a feature takes depends on whether its proposed structure is already catalogued.</text>

<rect x="30" y="70" width="296" height="142" rx="6" fill="#F2FAFC" stroke="#284A6F" stroke-width="1.5"/>
<text x="178" y="98" font-size="15" text-anchor="middle" fill="#001D38" font-weight="bold">Looked up</text>
<text x="178" y="118" font-size="11.5" text-anchor="middle" fill="#284A6F">structure already catalogued</text>
<text x="178" y="144" font-size="11.5" text-anchor="middle" fill="#5C6B7A">The classification already</text>
<text x="178" y="160" font-size="11.5" text-anchor="middle" fill="#5C6B7A">established for that compound</text>
<text x="178" y="176" font-size="11.5" text-anchor="middle" fill="#5C6B7A">is carried across unchanged</text>
<text x="178" y="198" font-size="11.5" text-anchor="middle" fill="#001D38">As dependable as the catalogue</text>

<rect x="334" y="70" width="296" height="142" rx="6" fill="#F2FAFC" stroke="#855DA3" stroke-width="1.5"/>
<text x="482" y="98" font-size="15" text-anchor="middle" fill="#001D38" font-weight="bold">Inferred</text>
<text x="482" y="118" font-size="11.5" text-anchor="middle" fill="#855DA3">structure new to the catalogue</text>
<text x="482" y="144" font-size="11.5" text-anchor="middle" fill="#5C6B7A">The agreed classification of the</text>
<text x="482" y="160" font-size="11.5" text-anchor="middle" fill="#5C6B7A">most chemically similar</text>
<text x="482" y="176" font-size="11.5" text-anchor="middle" fill="#5C6B7A">catalogued compounds</text>
<text x="482" y="198" font-size="11.5" text-anchor="middle" fill="#001D38">Broad class firmer than fine detail</text>

<rect x="30" y="230" width="600" height="62" rx="6" fill="#F2FAFC" stroke="#D3DFE7"/>
<text x="48" y="254" font-size="12.5" text-anchor="start" fill="#001D38" font-weight="bold">Every feature is placed in a pathway, whichever path it takes.</text>
<text x="48" y="276" font-size="12.5" text-anchor="start" fill="#5C6B7A">A looked-up assignment is firmer than an inferred one, and each report says which it is.</text>
</svg>
