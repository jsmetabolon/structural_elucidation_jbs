<svg xmlns="http://www.w3.org/2000/svg" width="660" height="312" viewBox="0 0 660 312" font-family="Arial, Helvetica, sans-serif">
<rect width="660" height="312" fill="white"/>
<text x="30" y="30" font-size="17" text-anchor="start" fill="#1f2933" font-weight="bold">Two paths to a biochemical assignment</text>
<text x="30" y="52" font-size="12" text-anchor="start" fill="#52606d">Which path a feature takes depends on whether its proposed structure is already catalogued.</text>

<rect x="30" y="70" width="296" height="142" rx="6" fill="#eef4fa" stroke="#2563a6" stroke-width="1.5"/>
<text x="178" y="98" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">Looked up</text>
<text x="178" y="118" font-size="11.5" text-anchor="middle" fill="#2563a6">structure already catalogued</text>
<text x="178" y="144" font-size="11.5" text-anchor="middle" fill="#52606d">The classification already</text>
<text x="178" y="160" font-size="11.5" text-anchor="middle" fill="#52606d">established for that compound</text>
<text x="178" y="176" font-size="11.5" text-anchor="middle" fill="#52606d">is carried across unchanged</text>
<text x="178" y="198" font-size="11.5" text-anchor="middle" fill="#1f2933">As dependable as the catalogue</text>

<rect x="334" y="70" width="296" height="142" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
<text x="482" y="98" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">Inferred</text>
<text x="482" y="118" font-size="11.5" text-anchor="middle" fill="#b45309">structure new to the catalogue</text>
<text x="482" y="144" font-size="11.5" text-anchor="middle" fill="#52606d">The agreed classification of the</text>
<text x="482" y="160" font-size="11.5" text-anchor="middle" fill="#52606d">most chemically similar</text>
<text x="482" y="176" font-size="11.5" text-anchor="middle" fill="#52606d">catalogued compounds</text>
<text x="482" y="198" font-size="11.5" text-anchor="middle" fill="#1f2933">Broad class firmer than fine detail</text>

<rect x="30" y="230" width="600" height="62" rx="6" fill="#f7f9fb" stroke="#d9e2ec"/>
<text x="48" y="254" font-size="12.5" text-anchor="start" fill="#1f2933" font-weight="bold">Every feature is placed in a pathway, whichever path it takes.</text>
<text x="48" y="276" font-size="12.5" text-anchor="start" fill="#52606d">A looked-up assignment is firmer than an inferred one, and each report says which it is.</text>
</svg>
