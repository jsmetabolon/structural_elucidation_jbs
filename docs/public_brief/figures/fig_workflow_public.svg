<svg xmlns="http://www.w3.org/2000/svg" width="660" height="290" viewBox="0 0 660 290" font-family="Montserrat, Avenir Next, Segoe UI, Arial, sans-serif">
<rect width="660" height="290" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="659" height="289" fill="none" stroke="#D9D9D9" stroke-width="0.75"/>
<text x="30" y="32" font-size="17" text-anchor="start" fill="#001D38" font-weight="bold">From detected signal to a graded result</text>

<rect x="30" y="60" width="144" height="118" rx="6" fill="#F2FAFC" stroke="#284A6F" stroke-width="1.5"/>
<text x="102" y="90" font-size="15" text-anchor="middle" fill="#001D38" font-weight="bold">Detect</text>
<text x="102" y="118" font-size="11.5" text-anchor="middle" fill="#5C6B7A">Reproducible</text>
<text x="102" y="134" font-size="11.5" text-anchor="middle" fill="#5C6B7A">unnamed features</text>
<text x="102" y="150" font-size="11.5" text-anchor="middle" fill="#5C6B7A">are extracted</text>

<rect x="190" y="60" width="144" height="118" rx="6" fill="#F2FAFC" stroke="#284A6F" stroke-width="1.5"/>
<text x="262" y="90" font-size="15" text-anchor="middle" fill="#001D38" font-weight="bold">Propose</text>
<text x="262" y="118" font-size="11.5" text-anchor="middle" fill="#5C6B7A">Candidate structures</text>
<text x="262" y="134" font-size="11.5" text-anchor="middle" fill="#5C6B7A">are assembled,</text>
<text x="262" y="150" font-size="11.5" text-anchor="middle" fill="#5C6B7A">beyond library</text>
<text x="262" y="166" font-size="11.5" text-anchor="middle" fill="#5C6B7A">membership</text>

<rect x="350" y="60" width="144" height="118" rx="6" fill="#F2FAFC" stroke="#284A6F" stroke-width="1.5"/>
<text x="422" y="90" font-size="15" text-anchor="middle" fill="#001D38" font-weight="bold">Weigh</text>
<text x="422" y="118" font-size="11.5" text-anchor="middle" fill="#5C6B7A">Candidates ordered</text>
<text x="422" y="134" font-size="11.5" text-anchor="middle" fill="#5C6B7A">by how well</text>
<text x="422" y="150" font-size="11.5" text-anchor="middle" fill="#5C6B7A">independent</text>
<text x="422" y="166" font-size="11.5" text-anchor="middle" fill="#5C6B7A">evidence agrees</text>

<rect x="510" y="60" width="144" height="118" rx="6" fill="#F2FAFC" stroke="#52B788" stroke-width="1.5"/>
<text x="582" y="90" font-size="15" text-anchor="middle" fill="#001D38" font-weight="bold">Report</text>
<text x="582" y="118" font-size="11.5" text-anchor="middle" fill="#5C6B7A">Each result graded,</text>
<text x="582" y="134" font-size="11.5" text-anchor="middle" fill="#5C6B7A">given pathway</text>
<text x="582" y="150" font-size="11.5" text-anchor="middle" fill="#5C6B7A">context, and</text>
<text x="582" y="166" font-size="11.5" text-anchor="middle" fill="#5C6B7A">claim-limited</text>

<path d="M 174 119 L 188 119" stroke="#B2BBC3" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 334 119 L 348 119" stroke="#B2BBC3" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 494 119 L 508 119" stroke="#B2BBC3" stroke-width="1.6" marker-end="url(#arrow)"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B2BBC3"/>
</marker>
</defs>

<rect x="30" y="204" width="624" height="62" rx="6" fill="#F2FAFC" stroke="#D3DFE7"/>
<text x="48" y="228" font-size="12.5" text-anchor="start" fill="#001D38" font-weight="bold">Every feature completes all four stages.</text>
<text x="48" y="250" font-size="12.5" text-anchor="start" fill="#5C6B7A">Where evidence does not support a structure, the final stage withholds it and says so.</text>
</svg>
